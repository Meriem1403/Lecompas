# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage (Vite) : les chemins profonds renvoient vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
