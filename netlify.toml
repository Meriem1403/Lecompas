# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_USE_BACKEND_API = "false"
  VITE_ALLOW_DEMO_LOGIN = "true"

# Application monopage (Vite) : les chemins profonds renvoient vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Déclarer la langue (complète lang=fr dans index.html pour les applis SPA)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Language = "fr-FR"
