services:
  db:
    image: postgres:16-alpine
    container_name: lecompas-db
    environment:
      POSTGRES_DB: lecompas
      POSTGRES_USER: lecompas
      POSTGRES_PASSWORD: lecompas
    ports:
      - "5433:5432"
    volumes:
      - lecompas_pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecompas -d lecompas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lecompas-backend
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://lecompas:lecompas@db:5432/lecompas
      API_PREFIX: /make-server-cfb78916
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lecompas-frontend
    environment:
      VITE_API_BASE: http://localhost:8000/make-server-cfb78916
      VITE_USE_BACKEND_API: "true"
      VITE_ALLOW_DEMO_LOGIN: "true"
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lecompas_pg_data:
