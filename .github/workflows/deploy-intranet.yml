name: Deploy intranet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USE_BACKEND_API: "false"
          VITE_ALLOW_DEMO_LOGIN: "true"
      - run: npm run test:unit
      - name: Stack API (PostgreSQL + backend)
        run: docker compose up -d --build db backend
      - run: node scripts/wait-for-backend.mjs
      - run: npm run test:integration
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run test:e2e:intranet

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        run: |
          if [ ! -f .env ]; then
            echo "Créez .env sur le serveur (voir .env.example) avant le premier deploy."
            exit 1
          fi
          docker compose -f docker-compose.prod.yml up -d --build
      - name: Smoke test (API + frontend)
        run: |
          set -a
          source .env
          set +a
          curl -fsS "http://127.0.0.1:${BACKEND_PORT:-8000}/make-server-cfb78916/health"
          curl -fsS -o /dev/null "http://127.0.0.1:${FRONTEND_PORT:-8080}/"
